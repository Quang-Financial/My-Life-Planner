<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#168353"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>My Life Planner</title></head><body><header><strong>✓ My Life Planner</strong><small>V1.0.0-alpha.3</small></header><nav id="nav"></nav><main id="main"></main><dialog id="editor"><form id="form"><h2>Công việc</h2><label>Tên công việc<input name="title" required maxlength="300"></label><label>Danh mục<select name="category"></select></label><label>Ngày thực hiện<input type="date" name="date" required></label><label>Hạn hoàn thành<input type="date" name="deadline"></label><label>Giờ bắt đầu<input type="time" name="time"></label><label>Dự kiến (phút)<input type="number" name="minutes" min="0" max="100000"></label><label>Ưu tiên<select name="priority"><option>Cao</option><option>Vừa</option><option>Thấp</option></select></label><label class="inline"><input type="checkbox" name="focus"> Việc trọng tâm</label><label>Mục tiêu liên kết<select name="goalId"></select></label><label>Ghi chú<textarea name="note"></textarea></label><p id="error" role="alert"></p><button>Lưu công việc</button> <button type="button" class="secondary" id="cancel">Hủy</button></form></dialog><script src="storage.js"></script><script src="goals.js"></script><script src="app.js"></script></body></html>
